<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAME OPTIONS letter-board — in-shell mockup</title>
<!--
  In-shell mockup for the GAME OPTIONS letter board (TODO 3).
  Companion file: settings-letterboard-mockup-PLAYER.html.

  The board renders inside a faithful copy of the game's 9:16 shell and
  popup layer (93.75%-height card, 941/1672 aspect, 13/14/15% face
  insets, scrim, X + APPLY buttons), so on an iPhone this IS the size
  the real board will be. Shell + palette rules are COPIED from
  styles.css per the _mockups convention; the board art is the live
  asset by relative path. Opens from disk on desktop; on the iPhone use
  John's bat server: http://<pc-ip>:8090/_mockups/<this file>.

  Decisions carried in (John, 2026-08-07): letter-board white lettering,
  brand words are the only orange, current green radio/checkbox style,
  "Game sounds" naming, no ambiance row. Lettering A/B toggle top-left.
-->
<!--
  2026-08-07, AFTER the build: the board art was cropped to its own
  edges (941x1672 canvas -> 752x1387 of pure artwork; the PNGs carried
  ~20% transparent margin), which let the same 93.75% card height show a
  board about 20% larger. This mockup was re-fitted to match the game:
  new aspect ratio, face insets, corner-button positions, and every size
  rebased from the card's width to the FACE's width. The layout itself
  is unchanged - only its measuring stick.
-->
<style>
  :root {
    --navy-950: #031019;
    --green: #27c978;
    --chalk: #e8e4da;
    --brand-face: #ec543d;
    --brand-brick: #a03426;
    --brand-cast: rgba(60, 30, 15, 0.55);
    --letter: #f2ede1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%,
      #244454 0%, #0d2532 40%, #02090e 100%);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding:
      max(5dvh, env(safe-area-inset-top))
      max(4px, env(safe-area-inset-right))
      max(5dvh, env(safe-area-inset-bottom))
      max(4px, env(safe-area-inset-left));
  }
  [hidden] { display: none !important; }
  button {
    font: inherit; color: inherit; cursor: pointer;
    border: none; background: none;
    -webkit-tap-highlight-color: transparent;
  }
  img { user-select: none; -webkit-user-drag: none; }

  /* ---- the 9:16 shell (copied from styles.css section 2) ---- */
  .app-shell {
    position: relative;
    width: min(calc(100vw - 8px), calc(90dvh * 0.5625));
    height: min(90dvh, calc((100vw - 8px) * 1.7778));
    overflow: hidden;
    background: var(--navy-950);
    border: 2px solid #46606b;
    box-shadow: 0 24px 80px #000c, inset 0 0 0 2px #0b1014;
  }

  /* ---- popup layer + card (copied from styles.css section 5) ---- */
  .popup-layer {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgb(2 7 10 / 68%);
    backdrop-filter: blur(2px);
  }
  .popup-card {
    position: relative;
    height: 93.75%;
    aspect-ratio: 752 / 1387;
    max-width: 96%;
    /* cqw units below track THIS card's width. */
    container-type: inline-size;
  }
  .board-art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  .popup-close {
    position: absolute;
    top: 0; right: 0.4%;
    width: clamp(35px, 12.01cqw, 50px);
    height: clamp(35px, 12.01cqw, 50px);
    z-index: 3;
    border-radius: 7px;
    border: 2px solid #fff;
    background: linear-gradient(#f4574c, #a20e08);
    color: #fff; font-weight: 900;
    font-size: clamp(17px, 6.13cqw, 28px); line-height: 1;
  }
  .popup-apply {
    position: absolute;
    bottom: 0; right: 0.4%;
    width: clamp(38px, 13.39cqw, 58px);
    height: clamp(38px, 13.39cqw, 58px);
    z-index: 3;
    border-radius: 7px;
    border: 2px solid #fff;
    background: linear-gradient(#2fbd7c, #0a6b3e);
    color: #fff; font-weight: 900;
    font-size: clamp(19px, 6.88cqw, 30px); line-height: 1;
  }

  /* ---- the board face: usable area inside the frame ---- */
  .board-face {
    position: absolute;
    left: 3.9%; right: 3.5%;
    top: 6.6%; bottom: 7.8%;
    /* cqw inside the face tracks the FACE, not the card. */
    container-type: inline-size;
    z-index: 2;
    display: flex;
    flex-direction: column;
    color: var(--letter);
    text-transform: uppercase;
    overflow: hidden;
  }

  /* ---- lettering variants (A default) ---- */
  .lettering-a .board-face {
    font-family: "Arial Black", "Arial Bold", Arial, sans-serif;
    font-weight: 900;
    letter-spacing: 0.05em;
  }
  .lettering-b .board-face {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    letter-spacing: 0.12em;
  }

  .board-title {
    text-align: center;
    font-size: 6.49cqw;
    margin: 2.03cqw 0 5.41cqw;
    letter-spacing: 0.09em;
  }
  .lettering-b .board-title { letter-spacing: 0.15em; }

  /* The sub-title gets the same visual padding above it (below the
     divider) that the main title gets from the board's top frame. */
  .board-title--sub { font-size: 5.95cqw; margin: 6.76cqw 0 2.7cqw; }

  .option-row {
    display: flex;
    align-items: center;
    gap: 3.78cqw;
    margin: 1.62cqw 0;
  }
  .option-row label {
    display: flex;
    align-items: center;
    gap: 1.76cqw;
    font-size: 4.19cqw;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Every setting on the board is a two-line group: a left-justified
     header, then a CENTERED options row with wide gaps so each radio
     is an easy independent tap. The --headline variant (GAME MODE and
     GLOBAL SOUND) is a step larger and brighter, with breathing room. */
  .setting-group { margin: 0 0 6.08cqw; }
  /* The last group's bottom margin is invisible slack — reclaim it to
     fund the sub-title's new top padding. */
  .setting-group:last-child { margin-bottom: 0; }
  .setting-group-label {
    font-size: 3.92cqw;
    opacity: 0.72;
    padding-left: 7.43cqw;
    margin-bottom: 1.35cqw;
  }
  .setting-group .option-row {
    justify-content: center;
    margin: 0;
    gap: 10.81cqw;
  }
  .setting-group .option-row label {
    font-size: 3.92cqw;
    opacity: 0.85;
  }
  .setting-group .option-row input[type="radio"] {
    width: 4.59cqw;
    height: 4.59cqw;
  }

  /* Doubled class beats the .setting-group margin shorthand. */
  .setting-group.setting-group--headline { margin: 4.05cqw 0 9.46cqw; }
  .setting-group--headline .setting-group-label {
    font-size: 5cqw;
    opacity: 1;
  }
  .setting-group--headline .option-row { gap: 8.11cqw; }
  .setting-group--headline .option-row label {
    font-size: 4.59cqw;
    opacity: 1;
  }
  .setting-group--headline .option-row input[type="radio"] {
    width: 6.22cqw;
    height: 6.22cqw;
  }

  /* The brand words run at the board's REGULAR option size. They were
     tried a step larger (5.27cqw); at that size GAME MODE is the widest
     row on the board and spilled onto the wooden frame on an iPhone, so
     the built board uses this size (John, 2026-08-07). */
  .setting-group--headline .option-row .brand-sign { font-size: 3.92cqw; }

  .option-row input[type="radio"],
  .option-row input[type="checkbox"] {
    accent-color: var(--green);
    width: 5.14cqw;
    height: 5.14cqw;
    cursor: pointer;
    margin: 0;
  }

  /* Inset from both sides so the rule reads as ON the board, not
     touching the frame. */
  .board-divider {
    border: 0;
    border-top: 0.68cqw solid rgb(242 237 225 / 85%);
    margin: 4.73cqw 9.46cqw 0;
    width: auto;
    align-self: stretch;
  }

  /* ---- brand words (copied brand rules) ---- */
  .brand-sign {
    font-family: "Arial Black", "Arial Bold", Arial, sans-serif;
    font-weight: 900;
    text-transform: none;
    letter-spacing: 0.01em;
    color: var(--brand-face);
    text-shadow:
      0.012em 0.012em 0 var(--brand-brick),
      0.024em 0.024em 0 var(--brand-brick),
      0.036em 0.036em 0 var(--brand-brick),
      0.048em 0.048em 0 var(--brand-brick),
      0.09em 0.11em 0.1em var(--brand-cast);
  }
  .brand-sign .brand-rush { font-size: 1.18em; }

  /* ---- floating lettering toggle (mockup chrome, not game UI) ---- */
  .variant-bar {
    position: fixed;
    top: max(6px, env(safe-area-inset-top));
    left: 6px;
    z-index: 20;
    display: flex;
    gap: 6px;
  }
  .variant-bar button {
    font-weight: 700;
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid rgb(232 228 218 / 45%);
    background: rgb(7 28 41 / 85%);
    color: var(--chalk);
  }
  .variant-bar button.is-active {
    background: var(--green);
    border-color: var(--green);
    color: #06231a;
  }
</style>
</head>
<body>

<div class="variant-bar">
  <button id="btnA" class="is-active">A</button>
  <button id="btnB">B</button>
</div>

<div class="app-shell lettering-a" id="shell">
  <div class="popup-layer">
    <div class="popup-card">
      <img class="board-art" src="../triageRush/assets/lobby-page/settings-blackboard.png" alt="">
      <button class="popup-close" type="button" aria-label="close">&#x2715;</button>
      <button class="popup-apply" type="button" aria-label="apply">&#x2713;</button>

      <div class="board-face">
        <div class="board-title">Game Options</div>

        <div class="setting-group setting-group--headline">
          <div class="setting-group-label">Game Mode</div>
          <div class="option-row">
            <label><input type="radio" name="mode" checked>
              <span class="brand-sign">Triage <span class="brand-rush">RUSH!</span></span></label>
            <label><input type="radio" name="mode">
              <span class="brand-sign">Triage!</span></label>
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-group-label">Scoring Difficulty</div>
          <div class="option-row">
            <label><input type="radio" name="difficulty" checked> Forgiving</label>
            <label><input type="radio" name="difficulty"> Strict</label>
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-group-label">Shift Length</div>
          <div class="option-row" id="rushLengths">
            <label><input type="radio" name="rushLength" checked> 60 seconds</label>
            <label><input type="radio" name="rushLength"> 120 seconds</label>
          </div>
          <div class="option-row" id="triageLengths" hidden>
            <label><input type="radio" name="triageLength" checked> 5 minutes</label>
            <label><input type="radio" name="triageLength"> 10 minutes</label>
          </div>
        </div>

        <hr class="board-divider">

        <div class="board-title board-title--sub">Sound Options</div>

        <div class="setting-group setting-group--headline">
          <div class="setting-group-label">Global Sound</div>
          <div class="option-row">
            <label><input type="radio" name="soundMaster"> Off</label>
            <label><input type="radio" name="soundMaster" checked> On</label>
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-group-label">Game Sounds</div>
          <div class="option-row">
            <label><input type="radio" name="gameLoud"> Off</label>
            <label><input type="radio" name="gameLoud"> Lo</label>
            <label><input type="radio" name="gameLoud" checked> Hi</label>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-group-label">Music</div>
          <div class="option-row">
            <label><input type="radio" name="musicLoud" checked> Off</label>
            <label><input type="radio" name="musicLoud"> Lo</label>
            <label><input type="radio" name="musicLoud"> Hi</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

const shell = document.getElementById("shell");
const btnA = document.getElementById("btnA");
const btnB = document.getElementById("btnB");
btnA.addEventListener("click", () => {
  shell.className = "app-shell lettering-a";
  btnA.classList.add("is-active"); btnB.classList.remove("is-active");
});
btnB.addEventListener("click", () => {
  shell.className = "app-shell lettering-b";
  btnB.classList.add("is-active"); btnA.classList.remove("is-active");
});

/* Mode radios swap which shift-length row shows (real game behavior). */
const modeRadios = document.querySelectorAll('input[name="mode"]');
modeRadios[0].addEventListener("change", () => {
  document.getElementById("rushLengths").hidden = false;
  document.getElementById("triageLengths").hidden = true;
});
modeRadios[1].addEventListener("change", () => {
  document.getElementById("rushLengths").hidden = true;
  document.getElementById("triageLengths").hidden = false;
});
</script>

</body>
</html>
