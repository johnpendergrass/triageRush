<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triageRush - Shift Review (variant B)</title>
<!--
  ==========================================================================
  SHIFT REVIEW MOCKUP (2026-08-05)

  A THROWAWAY comparison harness. It touches NOTHING in triageRush/.
  Delete the _mockups folder (and mock.html) to revert completely.

  John chose variant B ("LEGIBLE") on 2026-08-05, so the exploratory
  variants A / A2 / A3 / C were removed to keep this file maintainable
  while B is iterated on. They remain in git history if ever wanted.

  Two panes now:
    0 CURRENT  - the SHIPPED build, verbatim. Deliberately NOT updated with
                 the new scoring rules, because its whole job is to show
                 what the game does today for before/after comparison.
    B LEGIBLE  - the target design, carrying John's 2026-08-05 changes.

  Open at http://localhost:8090/mock.html (or /_mockups/...) - or from disk,
  since there is no fetch.
  ==========================================================================
-->
<style>
/* ---- copied from styles.css section 1: palette ---- */
:root {
  --navy-950: #031019;
  --navy-800: #0b2d3e;
  --cream: #efe6d6;
  --green: #27c978;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  color: var(--cream);
  background: radial-gradient(circle at 50% 20%, #244454 0%, #0d2532 40%, #02090e 100%);
  min-height: 100dvh;
  padding: 10px;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }

/* ---- harness chrome (never ships) ---- */
.harness {
  display: flex; flex-wrap: wrap; gap: 14px;
  justify-content: center; align-items: flex-start;
  margin-bottom: 10px; font-size: 12px;
}
.harness-group { display: flex; align-items: center; gap: 4px; }
.harness-group > b { letter-spacing: 0.14em; color: #8fa6b1; margin-right: 2px; font-size: 10px; }
.harness button {
  padding: 5px 9px; border: 1px solid #46606b; border-radius: 3px;
  background: #0b2d3e; letter-spacing: 0.06em;
}
.harness button[aria-pressed="true"] {
  background: var(--green); color: #04210f; font-weight: 800; border-color: #9ff0c4;
}
.harness-note { width: 100%; text-align: center; color: #8fa6b1; font-size: 11px; }

/* ---- copied from styles.css section 2: the 9:16 shell ---- */
.stage { display: grid; place-items: center; }
.app-shell {
  position: relative;
  width: min(calc(100vw - 8px), calc(78dvh * 0.5625));
  height: min(78dvh, calc((100vw - 8px) * 1.7778));
  overflow: hidden;
  background: var(--navy-950);
  border: 2px solid #46606b;
  border-radius: 10px;
  box-shadow: 0 24px 80px #000c, inset 0 0 0 2px #0b1014;
  container-type: inline-size;
  isolation: isolate;
}
.app-shell.is-phone { width: 320px; height: 569px; }

/* ======================================================================
   PANE 0 - CURRENT BUILD (verbatim from styles.css section 9)
   NOT updated with the new rules on purpose - it is the "before".
   ================================================================== */
.review-view {
  position: absolute; inset: 0;
  display: grid; place-items: stretch;
  padding: clamp(8px, 3cqw, 18px);
  background: linear-gradient(180deg, #0b2d3e, #031019 70%);
}
.review-paper {
  --paper-ink: #1b2a31;
  --paper-faint: #6d7b81;
  --paper-rule: #b9b2a0;
  --paper-correct: #17703f;
  --paper-close: #8a6100;
  --paper-wrong: #b3271c;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: clamp(10px, 4cqw, 22px) clamp(12px, 4.5cqw, 26px);
  border: 1px solid #8d8676; border-radius: 3px;
  background: linear-gradient(180deg, rgb(0 0 0 / 4%), rgb(0 0 0 / 0%) 12%), #f6f1e4;
  color: var(--paper-ink);
  box-shadow: 0 18px 50px #000c;
  text-align: left; overflow: hidden;
}
.review-head {
  border-top: 3px double var(--paper-rule);
  border-bottom: 3px double var(--paper-rule);
  padding: clamp(4px, 1.6cqw, 9px) 0; text-align: center;
}
.review-title { font-size: clamp(13px, 5.4cqw, 26px); font-weight: 900; letter-spacing: 0.08em; }
.review-mode {
  margin-top: 0.2em; font-size: clamp(8px, 3cqw, 14px);
  font-weight: 700; letter-spacing: 0.22em; color: var(--paper-faint);
}
.review-meta { display: flex; flex-direction: column; gap: clamp(2px, 1cqw, 6px); }
.review-meta-row { display: flex; align-items: baseline; gap: 0.5em; font-size: clamp(9px, 3.2cqw, 15px); }
.review-meta-key { font-weight: 700; letter-spacing: 0.12em; color: var(--paper-faint); }
.review-leader { flex: 1 1 auto; border-bottom: 1px dotted var(--paper-rule); transform: translateY(-0.25em); }
.review-meta-value { font-weight: 800; white-space: nowrap; }
.review-score-block { text-align: center; padding: clamp(2px, 1cqw, 6px) 0; }
.review-score-value {
  font-size: clamp(34px, 17cqw, 84px); font-weight: 900; line-height: 0.95;
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.review-score-value.is-negative { color: var(--paper-wrong); }
.review-score-label { font-size: clamp(8px, 3cqw, 14px); font-weight: 700; letter-spacing: 0.28em; color: var(--paper-faint); }
.review-formulas {
  display: grid; grid-template-columns: 1fr auto auto auto;
  align-items: baseline; column-gap: clamp(4px, 2cqw, 12px); row-gap: clamp(2px, 1cqw, 6px);
  border-top: 1px solid var(--paper-rule); border-bottom: 1px solid var(--paper-rule);
  padding: clamp(4px, 2cqw, 10px) 0;
  font-size: clamp(9px, 3.4cqw, 16px); font-variant-numeric: tabular-nums;
}
.review-formula-label { font-weight: 700; letter-spacing: 0.1em; }
.review-formula-count, .review-formula-multiplier { color: var(--paper-faint); font-weight: 700; }
.review-formula-subtotal { font-weight: 900; text-align: right; min-width: 3.4em; }
.review-formula-subtotal.review-formula--correct { color: var(--paper-correct); }
.review-formula-subtotal.review-formula--close { color: var(--paper-close); }
.review-formula-subtotal.review-formula--wrong { color: var(--paper-wrong); }
.review-directions { display: flex; justify-content: space-between; gap: clamp(6px, 3cqw, 16px); font-size: clamp(8px, 3cqw, 14px); }
.review-direction { display: flex; align-items: baseline; gap: 0.5em; }
.review-direction-label { font-weight: 700; letter-spacing: 0.12em; color: var(--paper-faint); }
.review-direction-count { font-weight: 900; font-size: 1.25em; font-variant-numeric: tabular-nums; }
.review-actions { display: flex; flex-direction: column; gap: clamp(6px, 2.4cqw, 12px); }
.review-seen, .review-return {
  min-height: 44px; border-radius: 4px; font-weight: 900;
  font-size: clamp(11px, 3.6cqw, 16px); letter-spacing: 0.08em; color: #fff;
  border: 1px solid rgb(255 255 255 / 35%);
  box-shadow: inset 0 1px #ffffff55, 0 2px 4px #0007;
}
.review-seen { background: linear-gradient(#2a6f92, #123f57); }
.review-return { background: linear-gradient(#15935b, #07572f); }

/* ======================================================================
   PANE B - THE TARGET DESIGN

   Legibility changes vs the current build:
     - the faint label ink goes from #6d7b81 to #4b585e (real contrast on
       cream, still clearly secondary)
     - every clamp minimum rises; nothing sits below 10px
     - letter-spacing on small-caps labels drops from 0.22em to ~0.10em,
       which was hurting the subheads more than the font size was
   ================================================================== */
.mock-view {
  position: absolute; inset: 0;
  display: grid; place-items: stretch;
  padding: clamp(6px, 2.5cqw, 14px);
  background: linear-gradient(180deg, #0b2d3e, #031019 70%);
}
.paper {
  --ink: #16232a;
  --faint: #4b585e;
  --rule: #a9a191;
  --ok: #14663a;
  --mid: #7a5600;
  --bad: #a52219;
  --stock: #f7f3e7;

  display: flex; flex-direction: column; justify-content: space-between;
  padding: clamp(10px, 3.6cqw, 20px) clamp(11px, 4cqw, 22px);
  color: var(--ink);
  background: var(--stock);
  border: 1px solid #8d8676;
  border-radius: 2px;
  box-shadow: 0 18px 50px #000c;
  overflow: hidden;
  text-align: left;
}

/* --- Head --- */
.clean-head { text-align: center; border-bottom: 2px solid var(--ink); padding-bottom: clamp(5px, 1.8cqw, 9px); }
/* Mixed case is deliberate: "TriageRUSH", not "TRIAGERUSH" (John,
   2026-08-05), so text-transform must never be applied here. */
.clean-title { font-size: clamp(16px, 5.6cqw, 27px); font-weight: 900; letter-spacing: 0.01em; line-height: 1.05; }
.clean-mode {
  margin-top: 0.3em; font-size: clamp(11px, 3.1cqw, 15px);
  font-weight: 700; letter-spacing: 0.02em; color: var(--faint);
}

/* --- Meta: 2 x 2 cells with left rules --- */
.clean-meta {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: clamp(4px, 1.6cqw, 9px) clamp(8px, 3cqw, 16px);
  margin-top: clamp(7px, 2.4cqw, 13px);
}
.clean-meta-cell { border-left: 3px solid var(--rule); padding-left: clamp(5px, 1.8cqw, 9px); }
.clean-meta-key { display: block; font-size: clamp(10px, 2.6cqw, 12px); font-weight: 700; letter-spacing: 0.06em; color: var(--faint); }
.clean-meta-value { display: block; font-size: clamp(13px, 3.7cqw, 17px); font-weight: 800; }

/* --- Score --- */
.clean-score { text-align: center; margin: clamp(6px, 2cqw, 11px) 0; }
.clean-score-label { font-size: clamp(11px, 3cqw, 13px); font-weight: 700; letter-spacing: 0.12em; color: var(--faint); }
.clean-score-value {
  font-size: clamp(46px, 19cqw, 92px); font-weight: 900; line-height: 0.92;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.clean-score-value.is-negative { color: var(--bad); }

/* --- Scoring table: ALWAYS three rows, CORRECT / CLOSE / WRONG.
       LEFT WAITING is gone entirely (John, 2026-08-05). --- */
.clean-table {
  display: grid; grid-template-columns: 1fr auto auto auto;
  align-items: baseline; column-gap: clamp(6px, 2.2cqw, 13px); row-gap: clamp(4px, 1.5cqw, 8px);
  border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  padding: clamp(6px, 2.2cqw, 12px) 0;
  font-size: clamp(12px, 3.5cqw, 17px); font-variant-numeric: tabular-nums;
}
.clean-cell-label { font-weight: 700; letter-spacing: 0.04em; }
.clean-cell-num { color: var(--faint); font-weight: 700; text-align: right; }
.clean-cell-total { font-weight: 900; text-align: right; min-width: 3.4em; }
.clean-cell-total.is-ok { color: var(--ok); }
.clean-cell-total.is-mid { color: var(--mid); }
.clean-cell-total.is-bad { color: var(--bad); }

/* A row that does not apply in this difficulty (CLOSE under Strict).
   It keeps its place so the table shape never changes, but recedes. */
.clean-cell-label.is-na { color: var(--faint); font-weight: 700; }
.clean-cell-total.is-na { color: var(--faint); font-weight: 700; letter-spacing: 0.06em; }

/* --- Direction counters: now buttons that explain themselves --- */
.clean-directions {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: clamp(6px, 2.4cqw, 14px); margin-top: clamp(6px, 2.2cqw, 12px);
}
.clean-direction {
  min-height: 44px; /* touch target floor (doc 7) */
  text-align: center; border: 1px solid var(--rule);
  padding: clamp(4px, 1.5cqw, 8px) 2px;
  background: transparent; color: inherit;
  border-radius: 2px;
}
.clean-direction:hover,
.clean-direction:focus-visible,
.clean-direction.is-active {
  background: rgb(0 0 0 / 5%);
  border-color: var(--ink);
  outline: none;
}
.clean-direction-count { display: block; font-size: clamp(19px, 6cqw, 30px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.clean-direction-label { display: block; margin-top: 2px; font-size: clamp(10px, 2.6cqw, 12px); font-weight: 700; letter-spacing: 0.06em; color: var(--faint); }

/* The shared help line. Its height is RESERVED so revealing an
   explanation never shifts the page - a hover that reflows the layout
   under the pointer is horrible on desktop and impossible on a phone. */
.clean-help {
  margin-top: clamp(4px, 1.4cqw, 7px);
  min-height: clamp(30px, 9cqw, 42px);
  font-size: clamp(10px, 2.8cqw, 13px); line-height: 1.3;
  color: var(--faint); text-align: center;
}
.clean-help.is-specific { color: var(--ink); font-weight: 700; }

/* --- Actions --- */
.mock-actions { display: flex; flex-direction: column; gap: clamp(6px, 2cqw, 10px); padding-top: clamp(8px, 2.5cqw, 14px); }
.mock-btn {
  min-height: 44px; border-radius: 4px; font-weight: 900;
  font-size: clamp(12px, 3.6cqw, 16px); letter-spacing: 0.06em; color: #fff;
  border: 1px solid rgb(255 255 255 / 35%);
  box-shadow: inset 0 1px #ffffff55, 0 2px 4px #0007;
}
.mock-btn--seen { background: linear-gradient(#2a6f92, #123f57); }
.mock-btn--return { background: linear-gradient(#15935b, #07572f); }
</style>
</head>
<body>

<div class="harness">
  <div class="harness-group">
    <b>VARIANT</b>
    <button type="button" data-variant="clean" aria-pressed="true">B LEGIBLE</button>
    <button type="button" data-variant="current" aria-pressed="false">0 CURRENT</button>
  </div>
  <div class="harness-group">
    <b>SHIFT</b>
    <button type="button" data-scenario="good" aria-pressed="true">TRIAGE / FORGIVING</button>
    <button type="button" data-scenario="rough" aria-pressed="false">RUSH / STRICT</button>
  </div>
  <div class="harness-group">
    <b>SIZE</b>
    <button type="button" data-size="desktop" aria-pressed="true">DESKTOP</button>
    <button type="button" data-size="phone" aria-pressed="false">iPHONE 320</button>
  </div>
  <p class="harness-note" id="harnessNote"></p>
</div>

<div class="stage">
  <div class="app-shell" id="shell"></div>
</div>

<script>
/* ==========================================================================
   Sample shifts. Point values are the real constants: +100 / +50 / -50.
   ====================================================================== */
const SCENARIOS = {
  good: {
    mode: "triage", difficulty: "forgiving",
    title: "RES", initials: "JMP",
    date: "Aug 5, 2026 · 2:14 PM",
    /* duration = time actually RUN; lengthLabel = the CONFIGURED setting.
       They differ whenever a shift ends early, which is why the mode line
       and the meta cell must not both claim to be "shift length". */
    duration: "5:00", lengthLabel: "5 minutes", seen: 11,
    correct: 6, close: 3, wrong: 2, waiting: 4,
    under: 1, over: 4
  },
  rough: {
    mode: "rush", difficulty: "strict",
    title: "Intern", initials: "KLR",
    date: "Aug 5, 2026 · 9:48 PM",
    duration: "2:00", lengthLabel: "120 seconds", seen: 5,
    correct: 2, close: 0, wrong: 3, waiting: 7,
    under: 2, over: 1
  }
};

/* Two scores on purpose:
     scoreLegacy - what the SHIPPED game computes, including the RUSH
                   left-waiting penalty. Pane 0 uses it.
     score       - the NEW rule (John, 2026-08-05): left-waiting is dropped
                   entirely, from all modes. Pane B uses it. */
function totalsFor(s) {
  const legacyWaitingMultiplier = s.mode === "rush" ? -10 : 0;
  const correctPts = s.correct * 100;
  const closePts = s.difficulty === "forgiving" ? s.close * 50 : 0;
  const wrongPts = s.wrong * -50;
  const waitingPts = s.waiting * legacyWaitingMultiplier;
  const score = correctPts + closePts + wrongPts;
  return {
    legacyWaitingMultiplier, correctPts, closePts, wrongPts, waitingPts,
    score,
    scoreLegacy: score + waitingPts
  };
}

function outcomeClass(points) {
  if (points > 0) return "is-ok";
  if (points < 0) return "is-bad";
  return "";
}

/* Player-facing mode names. Mixed case on TriageRUSH is deliberate. */
function modeName(s) { return s.mode === "rush" ? "TriageRUSH" : "Triage"; }
function difficultyName(s) { return s.difficulty === "strict" ? "Strict" : "Forgiving"; }

/* ==========================================================================
   PANE 0 - the shipped build, verbatim. Deliberately still shows LEFT
   WAITING and the old header, because it is the "before" picture.
   ====================================================================== */
function renderCurrent(s) {
  const t = totalsFor(s);
  const rows = [];
  rows.push(formulaRowCurrent("correct", "CORRECT", s.correct, 100));
  if (s.difficulty === "forgiving") rows.push(formulaRowCurrent("close", "CLOSE", s.close, 50));
  rows.push(formulaRowCurrent("wrong", "WRONG", s.wrong, -50));
  rows.push(formulaRowCurrent(null, "LEFT WAITING", s.waiting, t.legacyWaitingMultiplier));

  return `
  <section class="review-view">
    <div class="review-paper">
      <header class="review-head">
        <p class="review-title">${s.mode === "rush" ? "TRIAGERUSH COMPLETE" : "TRIAGE SHIFT COMPLETE"}</p>
        <p class="review-mode">${s.mode === "rush" ? "TRIAGERUSH" : "TRIAGE"} &middot; ${s.difficulty.toUpperCase()}</p>
      </header>
      <div class="review-meta">
        ${metaRowCurrent("PROVIDER", s.title + " " + s.initials)}
        ${metaRowCurrent("DATE", s.date)}
        ${metaRowCurrent("DURATION", s.duration)}
        ${metaRowCurrent("PATIENTS SEEN", s.seen)}
      </div>
      <div class="review-score-block">
        <p class="review-score-value${t.scoreLegacy < 0 ? " is-negative" : ""}">${t.scoreLegacy}</p>
        <p class="review-score-label">FINAL SCORE</p>
      </div>
      <div class="review-formulas">${rows.join("")}</div>
      <div class="review-directions">
        <p class="review-direction"><span class="review-direction-label">UNDER-TRIAGED</span><span class="review-direction-count">${s.under}</span></p>
        <p class="review-direction"><span class="review-direction-label">OVER-TRIAGED</span><span class="review-direction-count">${s.over}</span></p>
      </div>
      <div class="review-actions">
        <button class="review-seen" type="button">PATIENTS SEEN (${s.seen})</button>
        <button class="review-return" type="button">RETURN TO ER ENTRANCE</button>
      </div>
    </div>
  </section>`;
}
function metaRowCurrent(key, value) {
  return `<div class="review-meta-row">
    <span class="review-meta-key">${key}</span>
    <span class="review-leader"></span>
    <span class="review-meta-value">${value}</span>
  </div>`;
}
function formulaRowCurrent(mod, label, count, mult) {
  const m = mod ? " review-formula--" + mod : "";
  return `<span class="review-formula-label">${label}</span>
    <span class="review-formula-count">${count}</span>
    <span class="review-formula-multiplier">&times; ${mult}</span>
    <span class="review-formula-subtotal${m}">${count * mult}</span>`;
}

/* ==========================================================================
   PANE B - the target design
   ====================================================================== */

/* The two direction explanations. Since 2026-08-06 game.js
   classifyTriageDirection uses one acuity ladder (esi-1..5 = 1-5,
   psych = 6, discharge = 7): "over" means higher acuity than required (a
   LOWER rank), "under" the reverse, so Psych/Discharge misses move a
   counter too.

   NOTE the counters are populated in EVERY mode and difficulty (John,
   2026-08-05). Difficulty changes SCORING, not counting: direction is
   assigned to anything that is not "correct", so under Forgiving a CLOSE
   call also moves a counter, and under Strict — where close does not
   score — the counters still fill normally. Hence "misses", not "wrong
   calls", in the wording below. */
const DIRECTION_HELP = {
  none: "Neither is scored — they show which way your misses went. Counted in every mode, including Strict.",
  under: "UNDER-TRIAGED: sent to a room less urgent than the patient needed. The more dangerous error.",
  over: "OVER-TRIAGED: sent to a room more urgent than the patient needed. Safer, but it ties up the wrong resources."
};

function renderClean(s) {
  const t = totalsFor(s);
  const isStrict = s.difficulty === "strict";

  /* ALWAYS three rows, in the same order, so the table never changes
     shape between modes or difficulties (John, 2026-08-05). Under Strict
     the CLOSE row keeps its place and reads NA, with no count and no
     multiplier. LEFT WAITING is gone from every mode. */
  const rows = [
    cleanRow("CORRECT", s.correct, 100, t.correctPts),
    isStrict ? cleanRowNA("CLOSE") : cleanRow("CLOSE", s.close, 50, t.closePts),
    cleanRow("WRONG", s.wrong, -50, t.wrongPts)
  ];

  return `
  <section class="mock-view">
    <div class="paper">
      <header class="clean-head">
        <p class="clean-title">${s.mode === "rush" ? "TriageRUSH COMPLETE" : "TRIAGE SHIFT COMPLETE"}</p>
        <p class="clean-mode">MODE: ${modeName(s)}, ${difficultyName(s)}, ${s.lengthLabel}</p>
      </header>

      <div class="clean-meta">
        ${cleanMeta("PROVIDER", s.title + " " + s.initials)}
        ${cleanMeta("DURATION", s.duration)}
        ${cleanMeta("PATIENTS SEEN", s.seen)}
        ${cleanMeta("DATE", s.date)}
      </div>

      <div class="clean-score">
        <p class="clean-score-value${t.score < 0 ? " is-negative" : ""}">${t.score}</p>
        <p class="clean-score-label">FINAL SCORE</p>
      </div>

      <div class="clean-table">${rows.join("")}</div>

      <div class="clean-directions">
        <button class="clean-direction" type="button" data-help="under">
          <span class="clean-direction-count">${s.under}</span>
          <span class="clean-direction-label">UNDER-TRIAGED</span>
        </button>
        <button class="clean-direction" type="button" data-help="over">
          <span class="clean-direction-count">${s.over}</span>
          <span class="clean-direction-label">OVER-TRIAGED</span>
        </button>
      </div>
      <p class="clean-help" id="cleanHelp">${DIRECTION_HELP.none}</p>

      <div class="mock-actions">
        <button class="mock-btn mock-btn--seen" type="button">PATIENTS SEEN (${s.seen})</button>
        <button class="mock-btn mock-btn--return" type="button">RETURN TO ER ENTRANCE</button>
      </div>
    </div>
  </section>`;
}
function cleanMeta(key, value) {
  return `<div class="clean-meta-cell">
    <span class="clean-meta-key">${key}</span>
    <span class="clean-meta-value">${value}</span>
  </div>`;
}
function cleanRow(label, count, mult, total) {
  return `<span class="clean-cell-label">${label}</span>
    <span class="clean-cell-num">${count}</span>
    <span class="clean-cell-num">&times; ${mult}</span>
    <span class="clean-cell-total ${outcomeClass(total)}">${total}</span>`;
}
/* Not applicable in this difficulty: the row holds its place, the count
   and multiplier cells are empty, and the total reads NA. */
function cleanRowNA(label) {
  return `<span class="clean-cell-label is-na">${label}</span>
    <span class="clean-cell-num"></span>
    <span class="clean-cell-num"></span>
    <span class="clean-cell-total is-na">NA</span>`;
}

/* ==========================================================================
   Harness wiring
   ====================================================================== */
const RENDERERS = { current: renderCurrent, clean: renderClean };
const NOTES = {
  clean: "B: the chosen direction, with the 2026-08-05 changes - LEFT WAITING dropped from scoring entirely, CLOSE always shown (NA under Strict), new header wording and case, and the direction counters explain themselves on hover or tap.",
  current: "0: the SHIPPED build, unchanged - still scores LEFT WAITING and uses the old header. This is the 'before'."
};

let variant = "clean";
let scenario = "good";
let size = "desktop";

const shell = document.getElementById("shell");
const note = document.getElementById("harnessNote");

function draw() {
  shell.classList.toggle("is-phone", size === "phone");
  shell.innerHTML = RENDERERS[variant](SCENARIOS[scenario]);
  note.textContent = NOTES[variant];
  wireDirectionHelp();
}

/* Hover for a mouse, tap for a phone. iOS has no hover at all, so a
   hover-only affordance would be invisible on John's main device; the
   same buttons therefore toggle on click, and tapping the open one
   again closes it. */
function wireDirectionHelp() {
  const help = shell.querySelector("#cleanHelp");
  if (!help) return;
  const buttons = Array.from(shell.querySelectorAll(".clean-direction"));

  function show(key) {
    help.textContent = DIRECTION_HELP[key] || DIRECTION_HELP.none;
    help.classList.toggle("is-specific", Boolean(key));
  }
  function setPinned(button) {
    for (const other of buttons) other.classList.toggle("is-active", other === button);
    show(button ? button.dataset.help : null);
  }
  function pinnedButton() {
    return buttons.find(b => b.classList.contains("is-active")) || null;
  }

  for (const button of buttons) {
    button.addEventListener("mouseenter", () => show(button.dataset.help));
    button.addEventListener("mouseleave", () => {
      const pinned = pinnedButton();
      show(pinned ? pinned.dataset.help : null);
    });
    button.addEventListener("click", () => {
      setPinned(button.classList.contains("is-active") ? null : button);
    });
  }
}

document.querySelector(".harness").addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  const groups = [["variant", v => variant = v], ["scenario", v => scenario = v], ["size", v => size = v]];
  for (const [key, set] of groups) {
    const value = button.dataset[key];
    if (!value) continue;
    set(value);
    for (const sibling of button.parentElement.querySelectorAll("button")) {
      sibling.setAttribute("aria-pressed", String(sibling === button));
    }
  }
  draw();
});

draw();
</script>
