<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081017" />
    <title>triageRush — HOME Screen Test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="home-frame" aria-label="triageRush HOME screen preview">
      <img
        class="home-background"
        src="../triageRush/assets/home-screen/backgrounds/background-w-open-glass-doors%20852x1515.png"
        alt=""
      />

      <nav class="popup-preview-controls" aria-label="Preview HOME popups">
        <button type="button" data-popup="player">PLAYER</button>
        <button type="button" data-popup="shift">SHIFT</button>
        <button type="button" data-popup="about">ABOUT</button>
      </nav>

      <section class="boombox" aria-label="Sound controls">
        <img
          class="boombox-art"
          src="../triageRush/assets/home-screen/backgrounds/boombox.png"
          alt="A chrome 1990s boombox sound control center"
        />
        <button
          class="sound-toggle sound-toggle--power"
          id="powerToggle"
          type="button"
          aria-label="Turn radio power on"
          aria-pressed="false"
        ></button>
        <button
          class="sound-toggle is-on sound-toggle--music"
          id="musicToggle"
          type="button"
          aria-label="Music on"
          aria-pressed="true"
        ></button>
        <button
          class="sound-toggle is-on sound-toggle--ui"
          id="uiToggle"
          type="button"
          aria-label="User interface sounds on"
          aria-pressed="true"
        ></button>
      </section>

      <audio
        id="kingStream"
        preload="none"
        src="https://classicalking.streamguys1.com/KING-FM-128KAAC"
      ></audio>

      <section
        class="popup-layer"
        id="popupLayer"
        role="dialog"
        aria-modal="true"
        aria-label="HOME screen popup preview"
        hidden
      >
        <div class="popup-card">
          <img class="popup-art" id="popupArt" alt="" />
          <button
            class="popup-close"
            id="popupClose"
            type="button"
            aria-label="Close popup"
          >
            ×
          </button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
