<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081017" />
    <title>triageRush — HOME Screen Test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="home-frame" aria-label="triageRush HOME screen sound-control preview">
      <img
        class="home-background"
        src="../triageRush/assets/home-screen/backgrounds/HOME-open-doors%20852x1515.png"
        alt=""
      />

      <section class="boombox" id="boombox" aria-label="Sound controls">
        <img
          class="boombox-art"
          src="../triageRush/assets/home-screen/backgrounds/boombox.png"
          alt="A chrome 1990s boombox sound control center"
        />

        <button
          class="sound-toggle sound-toggle--power"
          id="powerToggle"
          type="button"
          aria-label="Turn radio power on"
          aria-pressed="false"
        ></button>

        <button
          class="sound-toggle is-on sound-toggle--music"
          id="musicToggle"
          type="button"
          aria-label="Music on"
          aria-pressed="true"
        ></button>

        <button
          class="sound-toggle is-on sound-toggle--ui"
          id="uiToggle"
          type="button"
          aria-label="User interface sounds on"
          aria-pressed="true"
        ></button>

      </section>

      <audio
        id="kingStream"
        preload="none"
        src="https://classicalking.streamguys1.com/KING-FM-128KAAC"
      ></audio>

      <section class="position-controller" aria-label="Position boombox cutout">
        <output class="coordinate-readout" id="coordinateReadout">
          X 447 · Y 1270 · SCALE 137%
        </output>

        <div class="direction-controls">
          <button
            class="move-button"
            type="button"
            data-dx="-1"
            data-dy="0"
            aria-label="Move boombox left one pixel"
          >
            &#9664;
          </button>
          <button
            class="move-button"
            type="button"
            data-dx="0"
            data-dy="-1"
            aria-label="Move boombox up one pixel"
          >
            &#9650;
          </button>
          <button
            class="move-button"
            type="button"
            data-dx="0"
            data-dy="1"
            aria-label="Move boombox down one pixel"
          >
            &#9660;
          </button>
          <button
            class="move-button"
            type="button"
            data-dx="1"
            data-dy="0"
            aria-label="Move boombox right one pixel"
          >
            &#9654;
          </button>
        </div>

        <div class="scale-controls" aria-label="Scale boombox">
          <button
            class="scale-button"
            id="scaleDown"
            type="button"
            aria-label="Make boombox one percent smaller"
          >
            &minus;
          </button>
          <output class="scale-readout" id="scaleReadout">137%</output>
          <button
            class="scale-button"
            id="scaleUp"
            type="button"
            aria-label="Make boombox one percent larger"
          >
            +
          </button>
        </div>

        <small>MOVE 1 PX · SCALE 1% · HOLD SHIFT FOR 10</small>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
